# /etc/nginx/sites-available/hydra-bot
#
# HYDRA BOT — NGINX reverse-proxy (production)
# ==============================================
# НЕТ limit_req_zone! Telegram шлёт webhook-запросы
# с ограниченного пула IP. Rate limit NGINX заблокирует
# серверы Telegram при наплыве трафика.
# Антиспам пользователей — внутри кода (ThrottleMiddleware).

server {
    listen 443 ssl http2;
    server_name zhurkinigor.fvds.ru;

    ssl_certificate     /etc/letsencrypt/live/zhurkinigor.fvds.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zhurkinigor.fvds.ru/privkey.pem;

    # Ограничение тела запроса (webhook-пакеты маленькие, >1MB = аномалия)
    client_max_body_size 1m;

    # ── Webhook от Telegram ──────────────────────────────
    # Только IP-адреса серверов Telegram (IPv4 + IPv6)
    # Источник: https://core.telegram.org/bots/webhooks#the-short-version
    location /webhook/ {
        # IPv4
        allow 149.154.160.0/20;
        allow 91.108.4.0/22;
        allow 91.108.8.0/22;
        allow 91.108.12.0/22;
        allow 91.108.16.0/22;
        allow 91.108.20.0/22;
        allow 91.108.56.0/22;
        # IPv6
        allow 2001:67c:4e8::/48;
        allow 2001:b28:f23d::/48;
        allow 2001:b28:f23f::/48;
        deny all;

        proxy_pass http://127.0.0.1:8443;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout    30s;
        proxy_connect_timeout 5s;
    }

    # ── Webhook от YooKassa ──────────────────────────────
    # Только IP-адреса серверов YooKassa
    # Источник: https://yookassa.ru/developers/using-api/webhooks#ip
    location /yookassa/ {
        allow 185.71.76.0/27;
        allow 185.71.77.0/27;
        allow 77.75.153.0/25;
        allow 77.75.156.11;
        allow 77.75.156.35;
        allow 77.75.154.128/25;
        deny all;

        proxy_pass http://127.0.0.1:8443;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── API админки (Patch 2) ────────────────────────────
    # Защита: X-Admin-Secret в приложении, rate limit в коде.
    # Лендинг (neurounit.fun) дергает с другого IP — whitelist невозможен.
    location /api/admin/ {
        proxy_pass http://127.0.0.1:8443;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Webhook сайта (оплата → уведомление в TG) ────────
    # Защита: X-Site-Secret в приложении.
    location /api/webhook/site {
        proxy_pass http://127.0.0.1:8443;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Health (для мониторинга) ─────────────────────────
    location /health {
        proxy_pass http://127.0.0.1:8443;
        proxy_set_header Host $host;
    }

    # ── Всё остальное — закрыто ──────────────────────────
    location / {
        return 444;
    }
}

# Редирект HTTP → HTTPS
server {
    listen 80;
    server_name zhurkinigor.fvds.ru;
    return 301 https://$host$request_uri;
}

# /etc/nginx/sites-available/hydra-bot-sandbox
#
# Sandbox reverse-proxy for isolated bot clone.

server {
    listen 443 ssl http2;
    server_name bot-sandbox.neurounit.fun;

    ssl_certificate     /etc/letsencrypt/live/bot-sandbox.neurounit.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot-sandbox.neurounit.fun/privkey.pem;

    client_max_body_size 1m;

    location /webhook/ {
        allow 149.154.160.0/20;
        allow 91.108.4.0/22;
        allow 91.108.8.0/22;
        allow 91.108.12.0/22;
        allow 91.108.16.0/22;
        allow 91.108.20.0/22;
        allow 91.108.56.0/22;
        allow 2001:67c:4e8::/48;
        allow 2001:b28:f23d::/48;
        allow 2001:b28:f23f::/48;
        deny all;

        proxy_pass http://127.0.0.1:18443;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /yookassa/ {
        allow 185.71.76.0/27;
        allow 185.71.77.0/27;
        allow 77.75.153.0/25;
        allow 77.75.156.11;
        allow 77.75.156.35;
        allow 77.75.154.128/25;
        deny all;

        proxy_pass http://127.0.0.1:18443;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/admin/ {
        proxy_pass http://127.0.0.1:18443;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/webhook/site {
        proxy_pass http://127.0.0.1:18443;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:18443;
        proxy_set_header Host $host;
    }

    location / {
        return 444;
    }
}

server {
    listen 80;
    server_name bot-sandbox.neurounit.fun;
    return 301 https://$host$request_uri;
}

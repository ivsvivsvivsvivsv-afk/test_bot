version: "1.0"
description: "Единый мастер-файл всех текстов по шагам сценария. Редактируйте здесь, потом мигрируйте в content/texts.json."

migration_notes:
  - "У каждого блока есть json_key — это будущий ключ в JSON."
  - "Плейсхолдеры {..} сохранять как есть."
  - "Тексты в HTML-совместимом формате для Telegram."

flow:
  start:
    step_01_welcome:
      json_key: "welcome"
      text: |
        🐉 <b>КВЕСТ «ГИДРА СИНГУЛЯРНОСТИ»</b>

        Добро пожаловать, искатель истины!

        Впереди тебя ждёт битва с трёхголовой Гидрой информационного хаоса.
        Каждая голова — это утверждение об ИИ и нейросетях.
        Правда или ложь — решать тебе.

        🎁 <b>Приз:</b> Отруби все 3 головы — получи награду!

        Готов начать?
      buttons:
        - "🎮 Начать Квест"
        - "🎬 Генератор видео"
        - "⚔️ Арена"

    step_02_welcome_back:
      json_key: "welcome_back"
      text: |
        👋 <b>С возвращением!</b>

        Ты уже проходил это испытание, воин.
        Если хочешь — переходи к воркшопу или другим активностям.

  quest:
    step_10_intro:
      json_key: "quest_intro"
      text: |
        ⚔️ <b>ПОДГОТОВКА К БИТВЕ</b>

        Прежде чем сразиться с Гидрой, тебе нужно:
        1️⃣ Выбрать свой <b>класс</b>
        2️⃣ Выбрать <b>оружие</b>
        3️⃣ Пройти <b>3 раунда</b> — отличить правду от лжи

        💡 <b>Совет:</b> Используй ИИ для проверки фактов.

        Готов?
      buttons:
        - "✅ Понятно, продолжить"

    step_11_select_class:
      json_key: "select_class"
      text: |
        ⚔️ <b>ШАГ 1: ВЫБЕРИ СВОЙ КЛАСС</b>

        💼 <b>Бизнесмен</b> — владелец дела, масштабирующийся с помощью ИИ
        🎨 <b>Творец</b> — создатель контента, использующий ИИ
        📊 <b>Аналитик</b> — специалист по данным и исследованиям
        📋 <b>Менеджер</b> — управленец, оптимизирующий процессы
      buttons:
        - "💼 Бизнесмен"
        - "🎨 Творец"
        - "📊 Аналитик"
        - "📋 Менеджер"

    step_12_select_weapon:
      json_key: "weapon_choice"
      text: |
        🗡️ <b>ШАГ 2: ВЫБЕРИ СВОЁ ОРУЖИЕ</b>

        Какая сфера тебе ближе?
        Выбери специализацию — и Гидра подготовит для тебя персональные испытания.
      buttons:
        - "📊 Маркетинг"
        - "📈 Аналитика"
        - "✍️ Копирайтинг"
        - "🎨 Дизайн"
        - "🧠 Менеджмент"
        - "🎬 Видео"

    step_13_round_names:
      keys:
        round_name_1: "🐉 ГОЛОВА ПЕРВАЯ: ХАОС"
        round_name_2: "🐉 ГОЛОВА ВТОРАЯ: СОМНЕНИЕ"
        round_name_3: "🐉 ГОЛОВА ТРЕТЬЯ: ИСТИНА"

    step_14_round_prompt:
      json_key: "round_intro"
      text: |
        ⚔️ <b>{round_name}</b>

        📜 <b>Утверждение:</b>
        <i>"{statement}"</i>

        💡 <b>Подсказка от мудреца:</b>
        {wisdom_prompt}

        Это ПРАВДА или ЛОЖЬ?
      buttons:
        - "✅ ПРАВДА"
        - "❌ ЛОЖЬ"

    step_15_round_result_correct:
      json_key: "round_correct"
      text: |
        ✅ <b>ВЕРНО!</b>

        🗡️ Ты отрубил голову Гидры!
        {head_message}

        Артефакты: <b>{score}</b>

    step_16_round_result_wrong:
      json_key: "round_wrong"
      text: |
        ❌ <b>Неверно!</b>

        🐍 Голова Гидры уцелела и стала сильнее...
        {continue_message}

        Артефакты: <b>{score}</b>

    step_17_head_messages:
      keys:
        head_round1_cut: "🔥 Первая голова повержена! Но две ещё живы..."
        head_round1_alive: "😈 Первая голова ухмыляется. Впереди ещё два испытания."
        head_round2_cut: "⚡ Вторая голова падает! Осталась последняя..."
        head_round2_alive: "🐍 Две головы смотрят на тебя голодными глазами."
        head_round3_cut: "🏆 ФИНАЛЬНЫЙ УДАР! Гидра повержена!"
        head_round3_alive: "💀 Гидра выжила... Но ты сражался достойно."

    step_18_final_results:
      keys:
        result_perfect: |
          🎖️ <b>ТЫ — МАСТЕР КРИТИЧЕСКОГО МЫШЛЕНИЯ!</b>

          3 из 3 — идеальный результат!
          Твоя суперсила готова к использованию! 🦸
        result_good: |
          🎖️ <b>ОТЛИЧНАЯ РАБОТА!</b>

          2 из 3 — достойный результат!
          Немного практики — и ты станешь экспертом! 💪
        result_ok: |
          💪 <b>НЕПЛОХОЕ НАЧАЛО!</b>

          1 из 3 — есть куда расти.
          Мы поможем тебе прокачаться! 📈
        result_bad: |
          💪 <b>ВСЁ ВПЕРЕДИ!</b>

          0 из 3 — Гидра оказалась сильнее...
          Но это только начало твоего пути! 🎓

    step_19_moral:
      json_key: "moral"
      text: |
        🧠 <b>МОРАЛЬ ИСТОРИИ</b>

        В эпоху ИИ критическое мышление — твоя главная суперсила.

        Нейросети могут:
        ✅ Генерировать тонны контента
        ✅ Отвечать на любые вопросы
        ❌ Но они МОГУТ ВРАТЬ — уверенно и убедительно

        Твоя задача — научиться проверять информацию.

        💡 <b>Хочешь узнать, как использовать ИИ без риска быть обманутым?</b>

        Приходи на бесплатный воркшоп!
      buttons:
        - "🚀 Хочу на воркшоп"

  contacts:
    step_30_intro:
      json_key: "contact_intro"
      text: |
        🎁 <b>ЗАБЕРИ СВОЙ ПОДАРОК!</b>

        Чтобы получить:
        📚 Гайд по фактчекингу с ИИ
        🎓 Приглашение на бесплатный воркшоп

        Оставь свой номер телефона 👇
      buttons:
        - "📱 Оставить контакт"
        - "⏭️ Пропустить"
      notes: |
        Telegram @username захватывается автоматически.
        Email НЕ собираем.

    step_31_phone:
      json_key: "contact_phone_request"
      text: |
        📱 <b>ВВЕДИ НОМЕР ТЕЛЕФОНА</b>

        Твой Telegram-ник мы уже сохранили автоматически.

        Теперь укажи номер телефона:
        • +7 XXX XXX XX XX (Россия)
        • +375 XX XXX XX XX (Беларусь)
        • 8XXXXXXXXXX (тоже подойдёт)

        Напиши номер в чат:
      notes: |
        Телефон ОБЯЗАТЕЛЬНЫЙ. Кнопки "Пропустить" нет.

    step_32_phone_hint:
      json_key: "contact_phone_format_hint"
      text: |
        <b>Примеры правильного формата:</b>
        • +79161234567
        • 89161234567
        • +375291234567

        Попробуй ещё раз:

    step_33_confirmation:
      notes: |
        Экран подтверждения показывает:
        📞 Телефон: +7XXXXXXXXXX
        🔗 Telegram: @username
        Кнопки: [✅ Подтвердить] [✏️ Изменить телефон]

    step_34_success:
      json_key: "contact_success"
      text: |
        ✅ <b>КОНТАКТЫ СОХРАНЕНЫ!</b>

        Спасибо! Мы свяжемся с тобой в ближайшее время.

        До встречи на воркшопе! 🚀

  arena_hackathon:
    step_40_intro:
      json_key: "arena_intro"
      text: |
        ⚔️ <b>АРЕНА НЕЙРО-ЮНИТ: ХАКАТОН</b>

        Если ты уже опытный — записывайся на хакатон!
        Это конкурс по созданию проектов с помощью нейросетей с ценными призами.

        Чтобы попасть, ответь на 3 коротких вопроса.
      buttons:
        - "🏆 Хочу участвовать!"
        - "⬅️ Назад"

    step_41_q1:
      json_key: "arena_q1"
      text: "📊 <b>Вопрос 1/3</b>\nКак давно ты используешь нейросети?"
      buttons:
        - "🟢 Только начинаю"
        - "🟡 Несколько месяцев"
        - "🔴 Больше года, использую ежедневно"

    step_42_q2:
      json_key: "arena_q2"
      text: "🛠 <b>Вопрос 2/3</b>\nКакие ИИ-инструменты ты используешь?"
      buttons:
        - "💬 ChatGPT / Claude"
        - "🎨 Midjourney / DALL-E / Stable Diffusion"
        - "🛠 API, автоматизации, собственные решения"
        - "📦 Всё вышеперечисленное"

    step_43_q3:
      json_key: "arena_q3"
      text: "🎯 <b>Вопрос 3/3</b>\nЧто хочешь создать на хакатоне?"
      buttons:
        - "🤖 Чат-бота или ассистента"
        - "📊 Аналитический инструмент"
        - "🎨 Генератор контента"
        - "💡 Свой проект (расскажу)"

    step_44_result:
      json_key: "arena_qualification_result"
      text: |
        🎉 <b>Отлично! Твой профиль:</b>

        📊 Опыт: {experience}
        🛠 Инструменты: {tools}
        🎯 Цель: {goal}

        ✅ Ты подходишь для участия в хакатоне!
        Оставь контакты — мы пригласим тебя.

    step_45_saved:
      json_key: "arena_contacts_saved"
      text: |
        ✅ <b>Заявка принята!</b>

        Ты в списке кандидатов на хакатон.
        Пока ждёшь старт — пройди квест «Гидра Сингулярности».
      buttons:
        - "🎮 Пройти квест"
        - "❌ Нет, спасибо"

  generator:
    step_50_info:
      json_key: "generator_info"
      text: |
        🎬 <b>ГЕНЕРАТОР ВИДЕО</b>

        Создай свой вирусный ролик с помощью ИИ!
        Перейди в бота-генератора:
      buttons:
        - "🎬 Открыть Генератор"

  followup:
    step_60_idle_reminder:
      json_key: "idle_reminder"
      text: |
        ⚔️ Герой, ты остановился в бою! Гидра наступает!

        Продолжи квест — игра скоро закончится! 🐉

    step_61_miniquests:
      keys:
        miniquest_day1: "Пока ты бездействовал, Гидра начала восстанавливаться. Одна из голов снова шепчет ложь..."
        miniquest_day2: "Ещё одна голова поднялась из тьмы. Чем дольше ты ждёшь, тем сильнее она становится..."
        miniquest_day3: "Гидра подобралась к стенам Data Sanctuary! Без твоей помощи защита падёт..."
        miniquest_day4: "Защитники устали. Они ждут тебя. Один удар правдой — и Гидра отступит..."
        miniquest_day5: "Это последний день. Завтра ворота закроются. Гидра или ты — кто победит?"
        miniquest_correct: "🎉 Отлично! Ты снова отрубил голову Гидре!"
        miniquest_wrong: "💪 Не сдавайся! Гидра хитра, но ты сильнее!"

    step_62_workshop_cta_by_day:
      keys:
        workshop_cta_day1: "Кстати, мы проводим бесплатный воркшоп, где ты научишься создавать своего ИИ-педагога за 30 минут. Хочешь присоединиться?"
        workshop_cta_day2: "Знаешь, что поможет окончательно победить Гидру? Практика! На нашем бесплатном воркшопе ты соберёшь первый НЕЙРОСКЕЛЕТ. Записаться?"
        workshop_cta_day3: "Ты доказал, что умеешь отличать правду от лжи. Пора перейти на новый уровень! Бесплатный воркшоп — твой следующий шаг к статусу НЕЙРО-ЮНИТ."
        workshop_cta_day4: "Ты сражаешься как настоящий герой! На бесплатном воркшопе ты получишь полный арсенал ИИ-инструментов. Железный Человек начинал так же."
        workshop_cta_day5: "Последний день. Последний шанс. Бесплатный воркшоп стартует скоро — и места заканчиваются. Запишись сейчас и заверши трансформацию."

  upsell_payment:
    step_70_offer:
      json_key: "upsell_offer"
      text: |
        🔥 <b>ЭКСКЛЮЗИВНОЕ ПРЕДЛОЖЕНИЕ</b>

        Вы можете получить разбор вашего бизнеса с помощью ИИ в прямом эфире.

        💰 Стоимость: {price} ₽
        🪑 Осталось мест: {remaining}/10
        ⏰ Бронь действует 15 минут
      buttons:
        - "💳 Оплатить"
        - "❌ Пропустить"

    step_71_no_slots:
      json_key: "upsell_no_slots"
      text: "😔 К сожалению, все места на разбор уже заняты."

    step_72_payment_success:
      json_key: "payment_success"
      text: |
        ✅ Оплата прошла! Вы забронировали место на разборе бизнеса.
        Мы свяжемся с вами для уточнения деталей.

    step_73_payment_refund:
      json_key: "payment_refund"
      text: |
        К сожалению, пока вы оформляли оплату, все места были заняты.
        Деньги автоматически возвращены на вашу карту.

admin:
  reset_user_usage:
    json_key: "reset_user_usage"
    text: |
      Использование: /reset_user <ID>
      Пример: /reset_user 123456789
